# PostgreSQL para desenvolvimento local: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: riale
      POSTGRES_PASSWORD: riale_dev
      POSTGRES_DB: riale_rh
    ports:
      - "5432:5432"
    volumes:
      - riale_pg:/var/lib/postgresql/data
volumes:
  riale_pg:
