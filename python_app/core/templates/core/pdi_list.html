{% extends "core/base.html" %}
{% block content %}
<h1 class="text-xl font-semibold">PDI</h1>
<div class="mt-4 space-y-2">
  {% for p in pdis %}
  <div class="rounded-lg border border-slate-200 bg-white p-4">
    <p class="font-medium">{{ p.employee.full_name }}</p>
    <p class="text-sm text-slate-500">{{ p.development_goal }}</p>
    <p class="text-xs text-slate-400 mt-1">Origem: {{ p.get_origin_display }} · {{ p.completion_pct }}% concluído</p>
  </div>
  {% empty %}
  <p class="text-sm text-slate-500">Nenhum PDI no seu escopo.</p>
  {% endfor %}
</div>
{% endblock %}
