{% extends "core/base.html" %}
{% block content %}
<h1 class="text-xl font-semibold">Colaboradores</h1>
<div class="mt-4 space-y-2">
  {% for e in employees %}
  <a href="{% url 'colaborador_detail' e.id %}" class="block rounded-lg border border-slate-200 bg-white p-4 hover:bg-slate-50">
    <p class="font-medium">{{ e.full_name }}</p>
    <p class="text-sm text-slate-500">{{ e.position.title }} · {{ e.department.name }} · {{ e.unit.name }} · {{ e.status }}</p>
  </a>
  {% empty %}
  <p class="text-sm text-slate-500">Nenhum colaborador no seu escopo.</p>
  {% endfor %}
</div>
{% endblock %}
