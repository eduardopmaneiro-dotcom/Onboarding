{% extends "core/base.html" %}
{% block guest_content %}
<div class="min-h-screen flex items-center justify-center">
  <form method="post" class="bg-white border border-slate-200 rounded-lg p-8 w-80 space-y-4">
    {% csrf_token %}
    <h1 class="text-lg font-semibold">Rede Riale</h1>
    {% if messages %}
      {% for message in messages %}
        <div class="rounded bg-red-50 text-red-700 px-3 py-2 text-sm">{{ message }}</div>
      {% endfor %}
    {% endif %}
    <div>
      <label class="block text-sm text-slate-600 mb-1">E-mail</label>
      <input type="email" name="email" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-sm text-slate-600 mb-1">Senha</label>
      <input type="password" name="password" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm">
    </div>
    <button type="submit" class="w-full bg-slate-900 text-white rounded py-2 text-sm">Entrar</button>
  </form>
</div>
{% endblock %}
